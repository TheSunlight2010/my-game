<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="refresh" content="0;url=https://thesunlight2010.github.io/void" />
  <title></title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <script type="module" src="./redirect.js"></script>
  <style>
    /* Minimal full-screen fallback while redirect happens */
    html,body{height:100%;margin:0;background:#0b0b0b;color:#ddd;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .center{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
    .dot{width:10px;height:10px;border-radius:50%;background:#f5f5f5;animation:blink 1s linear infinite}
    @keyframes blink{50%{opacity:.2}}
    a{color:#9ad;word-break:break-all}
  </style>
</head>
<body>
  <div class="center" aria-hidden="true">
    <div style="font-size:14px">Redirecting…</div>
    <div class="dot" aria-hidden="true"></div>
    <div style="font-size:12px;opacity:.9">If you are not redirected, <a id="fallback" href="https://thesunlight2010.github.io/void">click here</a>.</div>
  </div>
</body>
</html>
